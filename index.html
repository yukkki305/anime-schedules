<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日新番更新时间表</title>
  <link rel="stylesheet" href="css/style.css">

  <!-- B1 深色模式：在页面「画出来之前」就把主题定下来。
       如果等页面画完再改，深色模式下会先白闪一下，很刺眼。
       所以这 6 行必须放在这里、不能用 defer。 -->
  <script>
    (function () {
      var saved = null;
      try {
        saved = localStorage.getItem('anime:theme');
      } catch (e) {
        // 极少数浏览器在 file:// 下不给用 localStorage，那就当没存过
      }
      var theme = saved;
      if (theme !== 'light' && theme !== 'dark') {
        // 用户没手动选过，就跟着系统走
        theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>

  <header class="site-header">
    <h1>每日新番更新时间表</h1>
    <p class="subtitle">时间均为北京时间（UTC+8）</p>
    <button type="button" class="theme-btn" id="themeToggle" aria-label="切换深色/浅色">🌙</button>
  </header>

  <!-- 7 个星期按钮。阶段 1 只是摆着，点了没反应，切换留给阶段 3。 -->
  <nav class="weekday-nav" id="weekdayNav" aria-label="选择星期">
    <button type="button" class="weekday-btn" data-weekday="1">周一</button>
    <button type="button" class="weekday-btn is-active" data-weekday="2">周二</button>
    <button type="button" class="weekday-btn" data-weekday="3">周三</button>
    <button type="button" class="weekday-btn" data-weekday="4">周四</button>
    <button type="button" class="weekday-btn" data-weekday="5">周五</button>
    <button type="button" class="weekday-btn" data-weekday="6">周六</button>
    <button type="button" class="weekday-btn" data-weekday="0">周日</button>
  </nav>

  <!-- 卡片由 js/main.js 拿真实数据渲染进来 -->
  <main class="schedule" id="schedule"></main>

  <!-- 这行文字会随时变：加载中 / 加载失败 / 共几部。aria-live 让读屏软件也跟着念 -->
  <p class="hint" id="status" aria-live="polite"></p>

  <!-- 按加载顺序排：先工具，后界面，最后入口。全部普通脚本，不用 ES 模块。 -->
  <!-- data/titles-zh.js 是中文名对照表（甲方案），必须排在 zh.js 前面 -->
  <script src="data/titles-zh.js" defer></script>
  <script src="js/time.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/cache.js" defer></script>
  <script src="js/zh.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/theme.js" defer></script>
  <script src="js/main.js" defer></script>

</body>
</html>
